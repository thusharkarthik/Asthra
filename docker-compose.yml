  collab-service:
    build:
      context: ./services/collab-service
    container_name: asthra-collab-service
    env_file:
      - ./services/collab-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_collab.db
    ports:
      - "8009:8000"
    volumes:
      - collab_service_data:/app/data

  automation-service:
    build:
      context: ./services/automation-service
    container_name: asthra-automation-service
    env_file:
      - ./services/automation-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_automation.db
    ports:
      - "8010:8000"
    volumes:
      - automation_service_data:/app/data

  connect-service:
    build:
      context: ./services/connect-service
    container_name: asthra-connect-service
    env_file:
      - ./services/connect-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_connect.db
    ports:
      - "8011:8000"
    volumes:
      - connect_service_data:/app/data

  guard-service:
    build:
      context: ./services/guard-service
    container_name: asthra-guard-service
    env_file:
      - ./services/guard-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_guard.db
    ports:
