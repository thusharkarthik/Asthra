services:
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: asthra-api-gateway
    env_file:
      - ./services/api-gateway/.env.example
    ports:
      - "8080:8000"

  event-service:
    build:
      context: ./services/event-service
    container_name: asthra-event-service
    env_file:
      - ./services/event-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_events.db
    ports:
      - "8015:8000"
    volumes:
      - event_service_data:/app/data

  core-service:
    build:
      context: ./services/core-service
    container_name: asthra-core-service
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - ./services/core-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_core.db
    ports:
      - "8000:8000"
    volumes:
      - core_service_data:/app/data

  flow-service:
    build:
      context: ./services/flow-service
    container_name: asthra-flow-service
    env_file:
      - ./services/flow-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_flow.db
    ports:
      - "8001:8000"
    volumes:
      - flow_service_data:/app/data

  docs-service:
    build:
      context: ./services/docs-service
    container_name: asthra-docs-service
    env_file:
      - ./services/docs-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_docs.db
    ports:
      - "8002:8000"
    volumes:
      - docs_service_data:/app/data

  ai-service:
    build:
      context: ./services/ai-service
    container_name: asthra-ai-service
    env_file:
      - ./services/ai-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_intelligence.db
    ports:
      - "8003:8000"
    volumes:
      - ai_service_data:/app/data

  memory-service:
    build:
      context: ./services/memory-service
    container_name: asthra-memory-service
    env_file:
      - ./services/memory-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_memory.db
    ports:
      - "8004:8000"
    volumes:
      - memory_service_data:/app/data

  discover-service:
    build:
      context: ./services/discover-service
    container_name: asthra-discover-service
    env_file:
      - ./services/discover-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_discover.db
    ports:
      - "8005:8000"
    volumes:
      - discover_service_data:/app/data

  desk-service:
    build:
      context: ./services/desk-service
    container_name: asthra-desk-service
    env_file:
      - ./services/desk-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_desk.db
    ports:
      - "8006:8000"
    volumes:
      - desk_service_data:/app/data

  pulse-service:
    build:
      context: ./services/pulse-service
    container_name: asthra-pulse-service
    env_file:
      - ./services/pulse-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_pulse.db
    ports:
      - "8007:8000"
    volumes:
      - pulse_service_data:/app/data

  dev-service:
    build:
      context: ./services/dev-service
    container_name: asthra-dev-service
    env_file:
      - ./services/dev-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_dev.db
    ports:
      - "8008:8000"
    volumes:
