  insights-service:
    build:
      context: ./services/insights-service
    container_name: asthra-insights-service
    env_file:
      - ./services/insights-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_insights.db
    ports:
      - "8013:8000"
    volumes:
      - insights_service_data:/app/data

  media-service:
    build:
      context: ./services/media-service
    container_name: asthra-media-service
    env_file:
      - ./services/media-service/.env.example
    environment:
      DATABASE_URL: sqlite:////app/data/asthra_media.db
    ports:
      - "8014:8000"
    volumes:
      - media_service_data:/app/data

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: asthra-frontend
    env_file:
      - ./frontend/.env.example
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: http://localhost:8080
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - api-gateway

volumes:
  frontend_node_modules:
  frontend_next_cache:
  core_service_data:
  flow_service_data:
  docs_service_data:
  ai_service_data:
  memory_service_data:
  discover_service_data:
  desk_service_data:
  pulse_service_data:
  dev_service_data:
  collab_service_data:
  automation_service_data:
  connect_service_data:
  guard_service_data:
  insights_service_data:
  media_service_data:
  event_service_data:
